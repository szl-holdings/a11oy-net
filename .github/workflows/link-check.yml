name: Link & Asset Check

# Minimal, dependency-free guard for a static GitHub Pages site: verify the
# committed HTML parses and that every local link / asset (including the Open
# Graph image referenced in <meta>) resolves before it is published.
# Mirrors szl-holdings/szl-holdings.github.io's link-check.yml (same repo
# category: static Pages site behind a custom domain).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the exact main revision after Pages build_type is workflow
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  link-check:
    # This exact name is a required protected-branch context.
    name: Link & Asset Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${SOURCE_REVISION}" ]; then
            echo "Expected source ${SOURCE_REVISION}, got ${actual}" >&2
            exit 1
          fi

      - name: Check HTML parses + local links/assets resolve
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, sys, urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".").resolve()
          same_origin = {"a11oy.net", "www.a11oy.net"}
          errors = []

          class Extractor(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.anchors = set()

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get("id"):
                      self.anchors.add("#" + d["id"])
                  for key in ("href", "src", "poster"):
                      if d.get(key):
                          self.refs.append(d[key])
                  if d.get("srcset"):
                      self.refs.extend(
                          candidate.strip().split()[0]
                          for candidate in d["srcset"].split(",")
                          if candidate.strip()
                      )
                  # og:image / twitter:image live in <meta content=...>
                  ident = (d.get("property", "") + d.get("name", ""))
                  if d.get("content") and ident.endswith("image"):
                      self.refs.append(d["content"])

          def local_target(htmlfile, ref):
              parsed = urllib.parse.urlparse(ref)
              if parsed.scheme and parsed.scheme not in ("http", "https"):
                  return None
              if parsed.netloc and parsed.netloc.lower() not in same_origin:
                  return None

              decoded = urllib.parse.unquote(parsed.path)
              if not decoded:
                  candidate = root if parsed.netloc else htmlfile
              elif decoded.startswith("/"):
                  candidate = root / decoded.lstrip("/")
              else:
                  candidate = htmlfile.parent / decoded
              candidate = candidate.resolve()
              try:
                  candidate.relative_to(root)
              except ValueError:
                  errors.append(f"{htmlfile.relative_to(root)}: path escapes site root -> {ref}")
                  return None

              candidates = [candidate]
              if decoded.endswith("/") or candidate.is_dir():
                  candidates.insert(0, candidate / "index.html")
              elif not candidate.suffix:
                  candidates.extend((candidate.with_suffix(".html"), candidate / "index.html"))
              target = next((path for path in candidates if path.is_file()), None)
              if target is None:
                  errors.append(f"{htmlfile.relative_to(root)}: local target not found -> {ref}")
                  return None
              return target

          documents = {}
          for htmlfile in sorted(root.rglob("*.html")):
              if ".git" in htmlfile.relative_to(root).parts:
                  continue
              ex = Extractor()
              ex.feed(htmlfile.read_text(encoding="utf-8"))
              documents[htmlfile] = ex

          for htmlfile, ex in documents.items():
              for ref in ex.refs:
                  if not ref or ref.startswith(("data:", "mailto:", "tel:", "javascript:")):
                      continue
                  target = local_target(htmlfile, ref)
                  if target is None:
                      continue
                  fragment = urllib.parse.unquote(urllib.parse.urlparse(ref).fragment)
                  if fragment and target.suffix.lower() == ".html":
                      target_document = documents.get(target)
                      if target_document is None:
                          target_document = Extractor()
                          target_document.feed(target.read_text(encoding="utf-8"))
                      if "#" + fragment not in target_document.anchors:
                          errors.append(
                              f"{htmlfile.relative_to(root)}: fragment has no target -> {ref}"
                          )

          if (root / "sitemap.xml").exists():
              try:
                  ET.parse(root / "sitemap.xml")
              except ET.ParseError as e:
                  errors.append(f"sitemap.xml is not valid XML: {e}")

          if errors:
              print("Link/asset check FAILED:")
              for e in errors:
                  print(" -", e)
              sys.exit(1)
          print("OK: HTML parses and all local links/assets resolve.")
          PY

      - name: Validate proof registry surface
        run: python3 scripts/check_proof_surface.py

      - name: Validate historical evidence bindings and tamper regressions
        run: |
          python3 scripts/check_evidence_bindings.py
          python3 -m unittest discover -s tests -p test_evidence_bindings.py

      - name: Validate SZL Frontier source/evidence record
        run: python3 scripts/check_szl_frontier_record.py

      - name: Validate frozen confirmation evidence and canonical publication binding
        run: python3 tests/test_confirmation_record.py

      - name: Validate bounded OAC static release record
        run: python3 tests/test_oac_proof_contract.py

      - name: Validate diligence and machine evidence surface
        run: python3 scripts/check_diligence_surface.py

      - name: Validate generated atlas admission policy
        run: node scripts/check_atlas_policy.mjs

      - name: Validate fail-closed browser observation policy
        run: node scripts/check_probe_policy.mjs

      - name: Validate dated estate snapshot binding and freshness
        run: node scripts/check_estate_snapshot.mjs

      - name: Validate kernel chips bind /honest locked_formula_count
        run: |
          python3 scripts/check_honest_kernel_bind.py
          node scripts/check_honest_kernel_bind.mjs

      - name: Validate edge security contract
        run: |
          python3 scripts/check_security_headers.py
          python3 -m unittest discover -s tests -p test_global_script_coverage.py

      - name: Validate isolated Pages artifact builder
        run: python3 tests/test_pages_artifact.py

  pages-pr-build:
    # Legacy Pages emits this protected context only after main changes. This
    # PR-side job builds and inspects the exact raw artifact so protection can
    # evaluate the candidate before merge without pretending it was deployed.
    name: pages build and deployment
    if: github.event_name == 'pull_request'
    needs: link-check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${SOURCE_REVISION}" ]; then
            echo "Expected source ${SOURCE_REVISION}, got ${actual}" >&2
            exit 1
          fi

      - name: Build and inspect isolated Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_pages_artifact.py \
            --root . \
            --output "${RUNNER_TEMP}/a11oy-net-pages" \
            --source-revision "${SOURCE_REVISION}"

  pages-mode:
    name: Pages deployment mode
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Read Pages provider mode and fail closed
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          case "${build_type}" in
            legacy|workflow) ;;
            *)
              echo "Unsupported Pages build_type: ${build_type}" >&2
              exit 1
              ;;
          esac
          echo "build_type=${build_type}" >> "${GITHUB_OUTPUT}"
          if [ "${DEPLOY_REQUESTED}" = "true" ] && [ "${build_type}" != "workflow" ]; then
            echo "Deployment was requested while Pages build_type=${build_type}; refusing." >&2
            exit 1
          fi
          echo "Pages build_type=${build_type}. No runtime or header claim is inferred."

  pages-artifact:
    name: Build exact Pages artifact
    needs: [link-check, pages-mode]
    if: >-
      needs.pages-mode.outputs.build_type == 'workflow' &&
      (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Prove exact protected source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${SOURCE_REVISION}" ]; then
            echo "Expected source ${SOURCE_REVISION}, got ${actual}" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Build isolated exact-source artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_pages_artifact.py \
            --root . \
            --output "${RUNNER_TEMP}/a11oy-net-pages" \
            --source-revision "${SOURCE_REVISION}"

      - name: Upload exact-source Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/a11oy-net-pages
          include-hidden-files: true
          retention-days: 1

  pages-deploy:
    name: Deploy exact Pages artifact
    needs: pages-artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Reauthorize exact current protected main
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${current}" ] || [ "${current}" != "${SOURCE_REVISION}" ]; then
            echo "Protected main moved: expected ${SOURCE_REVISION}, current ${current:-UNAVAILABLE}." >&2
            exit 1
          fi

      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
