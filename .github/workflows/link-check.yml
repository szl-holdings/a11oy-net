name: Link & Asset Check

# Minimal, dependency-free guard for a static GitHub Pages site: verify the
# committed HTML parses and that every local link / asset (including the Open
# Graph image referenced in <meta>) resolves before it is published.
# Mirrors szl-holdings/szl-holdings.github.io's link-check.yml (same repo
# category: static Pages site behind a custom domain).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    # This exact name is a required protected-branch context.
    name: Link & Asset Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check HTML parses + local links/assets resolve
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, sys, urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".").resolve()
          same_origin = {"a11oy.net", "www.a11oy.net"}
          errors = []

          class Extractor(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.anchors = set()

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get("id"):
                      self.anchors.add("#" + d["id"])
                  for key in ("href", "src", "poster"):
                      if d.get(key):
                          self.refs.append(d[key])
                  if d.get("srcset"):
                      self.refs.extend(
                          candidate.strip().split()[0]
                          for candidate in d["srcset"].split(",")
                          if candidate.strip()
                      )
                  # og:image / twitter:image live in <meta content=...>
                  ident = (d.get("property", "") + d.get("name", ""))
                  if d.get("content") and ident.endswith("image"):
                      self.refs.append(d["content"])

          def local_target(htmlfile, ref):
              parsed = urllib.parse.urlparse(ref)
              if parsed.scheme and parsed.scheme not in ("http", "https"):
                  return None
              if parsed.netloc and parsed.netloc.lower() not in same_origin:
                  return None

              decoded = urllib.parse.unquote(parsed.path)
              if not decoded:
                  candidate = root if parsed.netloc else htmlfile
              elif decoded.startswith("/"):
                  candidate = root / decoded.lstrip("/")
              else:
                  candidate = htmlfile.parent / decoded
              candidate = candidate.resolve()
              try:
                  candidate.relative_to(root)
              except ValueError:
                  errors.append(f"{htmlfile.relative_to(root)}: path escapes site root -> {ref}")
                  return None

              candidates = [candidate]
              if decoded.endswith("/") or candidate.is_dir():
                  candidates.insert(0, candidate / "index.html")
              elif not candidate.suffix:
                  candidates.extend((candidate.with_suffix(".html"), candidate / "index.html"))
              target = next((path for path in candidates if path.is_file()), None)
              if target is None:
                  errors.append(f"{htmlfile.relative_to(root)}: local target not found -> {ref}")
                  return None
              return target

          documents = {}
          for htmlfile in sorted(root.rglob("*.html")):
              if ".git" in htmlfile.relative_to(root).parts:
                  continue
              ex = Extractor()
              ex.feed(htmlfile.read_text(encoding="utf-8"))
              documents[htmlfile] = ex

          for htmlfile, ex in documents.items():
              for ref in ex.refs:
                  if not ref or ref.startswith(("data:", "mailto:", "tel:", "javascript:")):
                      continue
                  target = local_target(htmlfile, ref)
                  if target is None:
                      continue
                  fragment = urllib.parse.unquote(urllib.parse.urlparse(ref).fragment)
                  if fragment and target.suffix.lower() == ".html":
                      target_document = documents.get(target)
                      if target_document is None:
                          target_document = Extractor()
                          target_document.feed(target.read_text(encoding="utf-8"))
                      if "#" + fragment not in target_document.anchors:
                          errors.append(
                              f"{htmlfile.relative_to(root)}: fragment has no target -> {ref}"
                          )

          if (root / "sitemap.xml").exists():
              try:
                  ET.parse(root / "sitemap.xml")
              except ET.ParseError as e:
                  errors.append(f"sitemap.xml is not valid XML: {e}")

          if errors:
              print("Link/asset check FAILED:")
              for e in errors:
                  print(" -", e)
              sys.exit(1)
          print("OK: HTML parses and all local links/assets resolve.")
          PY

      - name: Validate proof registry surface
        run: python3 scripts/check_proof_surface.py

      - name: Validate diligence and machine evidence surface
        run: python3 scripts/check_diligence_surface.py

      - name: Validate generated atlas admission policy
        run: node scripts/check_atlas_policy.mjs

      - name: Validate fail-closed browser observation policy
        run: node scripts/check_probe_policy.mjs

      - name: Validate edge security contract
        run: python3 scripts/check_security_headers.py

  pages-pr-build:
    # Legacy Pages emits this protected context only after main changes. This
    # PR-side job builds and inspects the exact raw artifact so protection can
    # evaluate the candidate before merge without pretending it was deployed.
    name: pages build and deployment
    if: github.event_name == 'pull_request'
    needs: link-check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and inspect raw Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/a11oy-net-pages.tar"
          listing="${RUNNER_TEMP}/a11oy-net-pages-files.txt"
          tar --exclude='./.git' --exclude='./.github' -cf "${archive}" .
          tar -tf "${archive}" > "${listing}"
          for required in \
            .nojekyll \
            .well-known/security.txt \
            404.html \
            _headers \
            api/build-info/index.html \
            assets/a11oy-mark.svg \
            assets/a11oy-net-social.png \
            assets/diligence.css \
            assets/kanchay.css \
            chat/index.html \
            code/index.html \
            diligence/index.html \
            evidence.json \
            health.json \
            index.html \
            llms.txt \
            notes/index.html \
            record.json \
            record/index.html \
            atlas.json \
            CHANGELOG.md \
            manifest.webmanifest \
            readyz/index.html \
            robots.txt \
            scripts/atlas_policy.js \
            scripts/check_probe_policy.mjs \
            scripts/probe_policy.js \
            site.webmanifest \
            sitemap.xml; do
            grep -Fxq "./${required}" "${listing}" || {
              echo "Pages artifact is missing ${required}" >&2
              exit 1
            }
          done
          test -s "${archive}"
