name: Roll out Holographic Proof v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rollout-holographic-proof-v2.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and render the proof patch without pushing a branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rollout-holographic-proof-v2
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind v2 to published proof documents
        run: python tools/rollout_holographic_proof_v2.py --report /tmp/holographic-proof-v2-rollout.json
      - name: Verify proof contracts and exact idempotence
        run: |
          python tests/test_holographic_proof_v2.py
          python tools/rollout_holographic_proof_v2.py --check
          python scripts/check_proof_surface.py
          python scripts/check_diligence_surface.py
          git diff --check
      - name: Upload secret-free rollout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holographic-proof-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/holographic-proof-v2-rollout.json
          if-no-files-found: error
          retention-days: 90
      - name: Push review branch
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feat/holographic-proof-v2-bind-20260902"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Review branch already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name "SZL Holographic Proof Controller"
          git config user.email "stephenlutar2@gmail.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "No rollout changes remain."
            exit 0
          fi
          git commit -s -m "feat(frontend): bind holographic proof v2"
          git push --set-upstream origin "$branch"
          echo "### Review branch" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$branch\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Show dry-run diff
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: git diff --stat
