# SPDX-License-Identifier: Apache-2.0
name: Materialize Alloy cross-tab bounded kernel once

on:
  push:
    branches:
      - fix/alloy-cross-tab-bounds-20260905
    paths:
      - .github/workflows/zz-materialize-alloy-cross-tab-bounds-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-alloy-cross-tab-bounds-once
  cancel-in-progress: false

jobs:
  materialize:
    name: bind current UI, run WebCrypto contracts, commit durable files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/alloy-cross-tab-bounds-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "22"

      - name: Bind the strong kernel to the current UI contract
        run: python tools/patch_alloy_cross_tab_contract.py

      - name: Prove syntax, cryptography, concurrency, bounds, and fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check estate/alloy-os/kernel.js
          node --check estate/alloy-os/app.js
          node --test tests/local-kernel.test.cjs
          python -m unittest tests.test_alloy_local_kernel -v
          python - <<'PY'
          from pathlib import Path
          source = Path("estate/alloy-os/kernel.js").read_text(encoding="utf-8")
          assert "MAX_RECEIPTS = 1024" in source
          assert "MAX_CAPSULES = 128" in source
          assert "cross-tab Web Locks are required" in source
          assert "generateKey({ name: 'AES-GCM', length: 256 }, false" in source
          assert "generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false" in source
          for forbidden in ("fetch(", "XMLHttpRequest", "WebSocket", "sendBeacon", "eval("):
              assert forbidden not in source, forbidden
          PY
          git diff --check

      - name: Commit only permanent runtime and contract changes
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/patch_alloy_cross_tab_contract.py
          git rm .github/workflows/zz-materialize-alloy-cross-tab-bounds-once.yml
          git add \
            estate/alloy-os/app.js \
            tests/test_alloy_local_kernel.py
          git config user.name "SZL Alloy Local Kernel Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "fix(alloy): serialize and bound browser-local state" \
            -m "Require cross-tab Web Locks, persist one verified non-extractable CryptoKey state atomically, cap receipts and capsules without eviction, and exercise the contract in Node WebCrypto and real Chromium." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/alloy-cross-tab-bounds-20260905
