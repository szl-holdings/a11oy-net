name: Local browser kernel contract
on:
  pull_request:
    branches: [main]
    paths:
      - estate/alloy-os/**
      - assets/**
      - scripts/szl-*.js
      - tests/local-kernel.test.cjs
      - tests/local_kernel_browser.py
      - .github/workflows/local-kernel-contract.yml
  push:
    branches: [main]
    paths:
      - estate/alloy-os/**
      - assets/**
      - scripts/szl-*.js
      - tests/local-kernel.test.cjs
      - tests/local_kernel_browser.py
      - .github/workflows/local-kernel-contract.yml
permissions:
  contents: read
concurrency:
  group: local-kernel-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crypto:
    name: Real WebCrypto and fail-closed local state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --check estate/alloy-os/kernel.js && node --check estate/alloy-os/app.js
      - run: node --test tests/local-kernel.test.cjs
  browser:
    name: Chromium persistence, concurrency and mobile delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the exact browser driver closure
        run: python -m pip install --no-deps --disable-pip-version-check playwright==1.55.0 pyee==13.0.0 greenlet==3.2.4
      - name: Exercise only disposable loopback browser storage
        run: python tests/local_kernel_browser.py
