name: Finalize local kernel and proof-surface contract

"on":
  push:
    branches:
      - fix/proof-local-kernel-delivery-20260905
    paths:
      - .github/workflows/_finalize_local_kernel_once.yml

permissions:
  contents: write

concurrency:
  group: finalize-local-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact kernel branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/proof-local-kernel-delivery-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python and Node
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0
        with:
          node-version: "22.19.0"

      - name: Align the exact sitemap contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_proof_surface.py')
          text = path.read_text(encoding='utf-8')
          old = '        "https://a11oy.net/estate/plane/",\n        "https://a11oy.net/command/",\n'
          new = '        "https://a11oy.net/estate/plane/",\n        "https://a11oy.net/estate/thread-ops/",\n        "https://a11oy.net/command/",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one sitemap insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove static kernel, proof surface, and CSP-safe browser source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/local_kernel_browser.py scripts/check_proof_surface.py
          node --check estate/alloy-os/kernel.js
          node --check estate/alloy-os/app.js
          node --test tests/local-kernel.test.cjs
          python scripts/check_proof_surface.py
          python scripts/check_diligence_surface.py
          ! grep -F 'wait_for_function' tests/local_kernel_browser.py
          grep -F 'production_csp_weakened' tests/local_kernel_browser.py
          git diff --check

      - name: Commit durable repair and remove consumed controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/check_proof_surface.py
          git rm -f -- \
            .github/workflows/_finalize_local_kernel_once.yml \
            .github/workflows/repair-proof-bindings-once.yml
          git commit -s -m 'fix(proof): complete CSP-safe local-kernel admission'
          git push origin HEAD:fix/proof-local-kernel-delivery-20260905
