# SPDX-License-Identifier: Apache-2.0
name: Repair Estate Alloy kernel v2

on:
  push:
    branches:
      - estate-os-bake-231-20260904
    paths:
      - .github/workflows/repair-estate-alloy-kernel-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-estate-alloy-kernel-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: estate-os-bake-231-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Install the missing first-party local kernel and repair sitemap contract
        shell: bash
        run: |
          set -euo pipefail
          cat > estate/alloy-os/kernel.js <<'JS'
          (() => {
            "use strict";

            const ADAPTER_CURRENT = "alloy-local-v1";
            const DB_NAME = "szl-alloy-local-v1";
            const DB_VERSION = 1;
            const STORE = "kernel";
            const STATE_KEY = "state";
            const encoder = new TextEncoder();
            const listeners = new Set();

            let database = null;
            let signing = null;
            let sealing = null;
            let publicKey = null;
            let state = {
              status: "BOOTING",
              identity: null,
              epoch: 1,
              receipts: [],
              capsules: [],
              health: {
                healed: 0,
                blocked: 0,
                ledgerReplayable: false,
                lastVerify: null,
              },
            };

            function notify() {
              for (const listener of listeners) {
                try { listener(); } catch (_) { /* observers cannot break the kernel */ }
              }
            }

            function canonical(value) {
              if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
              if (value && typeof value === "object") {
                return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
              }
              return JSON.stringify(value);
            }

            function bytesToHex(bytes) {
              return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
            }

            function bytesToBase64(bytes) {
              let binary = "";
              for (const byte of bytes) binary += String.fromCharCode(byte);
              return btoa(binary);
            }

            async function sha256Bytes(value) {
              const bytes = typeof value === "string" ? encoder.encode(value) : value;
              return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
            }

            async function sha256(value) {
              return bytesToHex(await sha256Bytes(value));
            }

            function openDatabase() {
              return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = () => {
                  const db = request.result;
                  if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error("indexeddb_open_failed"));
              });
            }

            function readState() {
              return new Promise((resolve, reject) => {
                const request = database.transaction(STORE, "readonly").objectStore(STORE).get(STATE_KEY);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => reject(request.error || new Error("indexeddb_read_failed"));
              });
            }

            function writeState() {
              const snapshot = {
                schema: "szl.alloy.local-kernel/v1",
                state: {
                  status: state.status,
                  identity: state.identity,
                  epoch: state.epoch,
                  receipts: state.receipts,
                  capsules: state.capsules,
                  health: state.health,
                },
                keys: { signing, publicKey, sealing },
              };
              return new Promise((resolve, reject) => {
                const request = database.transaction(STORE, "readwrite").objectStore(STORE).put(snapshot, STATE_KEY);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error || new Error("indexeddb_write_failed"));
              });
            }

            async function createIdentity() {
              const generated = await crypto.subtle.generateKey(
                { name: "ECDSA", namedCurve: "P-256" },
                true,
                ["sign", "verify"],
              );
              const rawPublic = new Uint8Array(await crypto.subtle.exportKey("raw", generated.publicKey));
              const privatePkcs8 = await crypto.subtle.exportKey("pkcs8", generated.privateKey);
              signing = await crypto.subtle.importKey(
                "pkcs8",
                privatePkcs8,
                { name: "ECDSA", namedCurve: "P-256" },
                false,
                ["sign"],
              );
              publicKey = await crypto.subtle.importKey(
                "raw",
                rawPublic,
                { name: "ECDSA", namedCurve: "P-256" },
                false,
                ["verify"],
              );

              const generatedSealing = await crypto.subtle.generateKey(
                { name: "AES-GCM", length: 256 },
                true,
                ["encrypt", "decrypt"],
              );
              const rawSealing = await crypto.subtle.exportKey("raw", generatedSealing);
              sealing = await crypto.subtle.importKey(
                "raw",
                rawSealing,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"],
              );
              state.identity = { kid: `p256:${(await sha256(rawPublic)).slice(0, 20)}` };
            }

            async function appendReceipt(type, note, data = {}) {
              const sequence = state.receipts.length + 1;
              const previous = state.receipts.length ? state.receipts[state.receipts.length - 1].digest : "0".repeat(64);
              const body = {
                schema: "szl.alloy.local-receipt/v1",
                seq: sequence,
                type,
                note,
                epoch: state.epoch,
                at: new Date().toISOString(),
                previous,
                dataDigest: await sha256(canonical(data)),
                kid: state.identity.kid,
              };
              const digest = await sha256(canonical(body));
              const signature = new Uint8Array(await crypto.subtle.sign(
                { name: "ECDSA", hash: "SHA-256" },
                signing,
                encoder.encode(digest),
              ));
              const receipt = { ...body, digest, signature: bytesToBase64(signature) };
              state.receipts.push(receipt);
              return receipt;
            }

            async function verifyLedger() {
              let previous = "0".repeat(64);
              for (let index = 0; index < state.receipts.length; index += 1) {
                const receipt = state.receipts[index];
                if (receipt.seq !== index + 1 || receipt.previous !== previous) return false;
                const { digest, signature, ...body } = receipt;
                if (await sha256(canonical(body)) !== digest) return false;
                const signatureBytes = Uint8Array.from(atob(signature), (character) => character.charCodeAt(0));
                const valid = await crypto.subtle.verify(
                  { name: "ECDSA", hash: "SHA-256" },
                  publicKey,
                  signatureBytes,
                  encoder.encode(digest),
                );
                if (!valid) return false;
                previous = digest;
              }
              return true;
            }

            async function persistVerified() {
              state.health.ledgerReplayable = await verifyLedger();
              state.health.lastVerify = new Date().toISOString();
              if (!state.health.ledgerReplayable) throw new Error("ledger_verification_failed");
              await writeState();
              notify();
            }

            async function boot() {
              try {
                if (!globalThis.crypto?.subtle || !globalThis.indexedDB) throw new Error("browser_crypto_or_indexeddb_unavailable");
                database = await openDatabase();
                const saved = await readState();
                if (saved?.schema === "szl.alloy.local-kernel/v1" && saved.keys) {
                  state = saved.state;
                  signing = saved.keys.signing;
                  publicKey = saved.keys.publicKey;
                  sealing = saved.keys.sealing;
                  state.status = "VERIFYING";
                } else {
                  await createIdentity();
                  await appendReceipt("GENESIS", "local kernel identity created", { adapter: ADAPTER_CURRENT });
                }
                if (!(signing && publicKey && sealing && state.identity?.kid)) throw new Error("kernel_key_state_incomplete");
                state.health.ledgerReplayable = await verifyLedger();
                state.health.lastVerify = new Date().toISOString();
                state.status = state.health.ledgerReplayable ? "READY" : "DEGRADED";
                if (state.status === "READY") await writeState();
                notify();
                return state.status;
              } catch (error) {
                state.status = `UNAVAILABLE:${error?.message || "boot_failed"}`;
                state.health.ledgerReplayable = false;
                state.health.lastVerify = new Date().toISOString();
                notify();
                return state.status;
              }
            }

            async function govern(request) {
              if (state.status !== "READY") {
                return { decision: "BLOCK", reason: "local kernel is not ready", receipt: { seq: 0 } };
              }
              const title = String(request?.title || "").trim().slice(0, 160);
              const body = String(request?.body || "").trim().slice(0, 12000);
              const adapter = String(request?.adapter || "");
              const policyClass = String(request?.policyClass || "private").slice(0, 64);
              if (!title || !body || adapter !== ADAPTER_CURRENT) {
                state.health.blocked += 1;
                const reason = adapter !== ADAPTER_CURRENT ? "adapter pin mismatch" : "title and payload are required";
                const receipt = await appendReceipt("BLOCK", reason, {
                  adapter,
                  titleDigest: await sha256(title),
                  payloadDigest: await sha256(body),
                });
                await persistVerified();
                return { decision: "BLOCK", reason, receipt };
              }

              const plaintext = encoder.encode(canonical({ title, body, policyClass, adapter }));
              const digest = await sha256(plaintext);
              const iv = crypto.getRandomValues(new Uint8Array(12));
              const ciphertext = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sealing, plaintext));
              state.capsules.push({
                schema: "szl.alloy.local-capsule/v1",
                id: `sha256:${digest}`,
                digest,
                title,
                status: "SEALED_LOCAL_ONLY",
                createdAt: new Date().toISOString(),
                iv: bytesToBase64(iv),
                ciphertext: bytesToBase64(ciphertext),
                adapter,
                policyClass,
              });
              const receipt = await appendReceipt("CAPSULE_SEALED", "local capsule sealed; no external action", {
                digest,
                adapter,
                policyClass,
              });
              await persistVerified();
              return { decision: "ALLOW", reason: "sealed on this device; no external action authority", receipt };
            }

            async function injectFault() {
              if (state.status !== "READY") return "Kernel is not ready.";
              if (!state.receipts.length) await appendReceipt("PROBE", "fault probe baseline", {});
              const receipt = state.receipts[state.receipts.length - 1];
              receipt.note = `${receipt.note} [one-byte fault]`;
              state.health.ledgerReplayable = await verifyLedger();
              state.health.lastVerify = new Date().toISOString();
              notify();
              return state.health.ledgerReplayable ? "Fault injection did not alter the ledger." : "One-byte ledger fault detected; persisted snapshot remains intact.";
            }

            async function runWatchdog() {
              if (!database) return;
              const saved = await readState();
              if (!saved?.state || !saved?.keys) throw new Error("verified_snapshot_unavailable");
              state = saved.state;
              signing = saved.keys.signing;
              publicKey = saved.keys.publicKey;
              sealing = saved.keys.sealing;
              if (!(await verifyLedger())) {
                state.status = "DEGRADED";
                state.health.ledgerReplayable = false;
                notify();
                throw new Error("persisted_snapshot_failed_verification");
              }
              state.health.healed += 1;
              state.status = "READY";
              await appendReceipt("HEAL", "watchdog restored the last verified local snapshot", {});
              await persistVerified();
            }

            function subscribe(listener) {
              if (typeof listener === "function") listeners.add(listener);
              return () => listeners.delete(listener);
            }

            function shortHex(value) {
              const text = String(value || "");
              return text.length > 16 ? `${text.slice(0, 8)}…${text.slice(-6)}` : text;
            }

            const api = {
              ADAPTER_CURRENT,
              boot,
              govern,
              injectFault,
              runWatchdog,
              subscribe,
              shortHex,
              get status() { return state.status; },
              get identity() { return state.identity; },
              get epoch() { return state.epoch; },
              get receipts() { return state.receipts; },
              get capsules() { return state.capsules; },
              get health() { return state.health; },
            };

            globalThis.Alloy = Object.freeze(api);
          })();
          JS

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_proof_surface.py")
          source = path.read_text(encoding="utf-8")
          old = '''        "https://a11oy.net/estate/plane/",\n        "https://a11oy.net/command/",'''
          new = '''        "https://a11oy.net/estate/plane/",\n        "https://a11oy.net/estate/thread-ops/",\n        "https://a11oy.net/command/",'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("sitemap contract insertion anchor is missing")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Prove the complete static and local-runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node --check estate/alloy-os/kernel.js
          python -m py_compile scripts/check_proof_surface.py tools/rollout_proof_flow_shell.py tools/rollout_holographic_proof_v2.py
          python tools/rollout_proof_flow_shell.py --check --report /tmp/flow-check.json
          python tools/rollout_holographic_proof_v2.py --check --report /tmp/holo-check.json
          python scripts/check_proof_surface.py
          python scripts/check_diligence_surface.py
          python -m pytest -q tests
          git diff --check

      - name: Commit durable repair and remove the controller
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-estate-alloy-kernel-v2.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "fix(proof): restore the local Alloy kernel and sitemap contract"
          git push origin HEAD:estate-os-bake-231-20260904
