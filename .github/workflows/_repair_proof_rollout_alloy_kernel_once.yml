name: Repair proof rollout ledgers and Alloy local kernel

"on":
  push:
    branches:
      - fix/proof-rollout-alloy-kernel-20260905
    paths:
      - estate/alloy-os/kernel.js
      - tests/test_alloy_local_kernel.py
      - .github/workflows/_repair_proof_rollout_alloy_kernel_once.yml

permissions:
  contents: write

concurrency:
  group: repair-proof-rollout-alloy-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Apply canonical binders, run the full suite, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact base-repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/proof-rollout-alloy-kernel-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply the repository-owned proof Flow Shell
        shell: bash
        run: |
          set -euo pipefail
          python tools/rollout_proof_flow_shell.py \
            --report /tmp/proof-flow-shell-repair.json

      - name: Apply the repository-owned holographic proof binder
        shell: bash
        run: |
          set -euo pipefail
          python tools/rollout_holographic_proof_v2.py \
            --report /tmp/holographic-proof-v2-repair.json

      - name: Require the exact deterministic source delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          # The two frontier documents are already bound on protected main; only
          # their generated ledgers were stale. Ñan became a complete HTML
          # document after the first run and is now admitted by both binders.
          expected = {
              "estate/alloy-os/index.html",
              "frontend-flow-shell-state.json",
              "holographic-experience-v2/rollout-state.json",
              "khipu/nan/index.html",
              "status/index.html",
          }
          observed = {
              row
              for row in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
              if row
          }
          if observed != expected:
              raise SystemExit(
                  f"canonical binder delta mismatch: expected={sorted(expected)} "
                  f"observed={sorted(observed)}"
              )
          PY

      - name: Prove kernel, rollout, links, and full Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            pytest==8.4.2 ruff==0.12.12
          node --check estate/alloy-os/kernel.js
          python tools/rollout_proof_flow_shell.py --check
          python tools/rollout_holographic_proof_v2.py --check
          ruff check . --select E9,F
          pytest -q tests
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          alloy = (root / 'estate/alloy-os/index.html').read_text(encoding='utf-8')
          nan = (root / 'khipu/nan/index.html').read_text(encoding='utf-8')
          assert '<script src="./kernel.js"></script>' in alloy
          assert (root / 'estate/alloy-os/kernel.js').is_file()
          for page in (alloy, nan):
              assert page.count('data-szl-proof-flow-asset="style"') == 1
              assert page.count('data-szl-proof-flow-asset="script"') == 1
              assert page.count('data-szl-proof-holo-asset="style-v2"') == 1
              assert page.count('data-szl-proof-holo-asset="script-v2"') == 1
          PY
          git diff --check

      - name: Commit permanent base repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            estate/alloy-os/index.html \
            frontend-flow-shell-state.json \
            holographic-experience-v2/rollout-state.json \
            khipu/nan/index.html \
            status/index.html
          git rm -- .github/workflows/_repair_proof_rollout_alloy_kernel_once.yml
          git commit -s -m 'fix(proof): restore rollout parity and Alloy local kernel'
          git push origin HEAD:fix/proof-rollout-alloy-kernel-20260905
