name: Proof Flow Shell Contract

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/szl-flow-proof.css"
      - "scripts/szl-flow-proof.js"
      - "frontend-theme-registry-v1.json"
      - "frontend-flow-shell-state.json"
      - "tools/rollout_proof_flow_shell.py"
      - "tests/test_proof_flow_shell.py"
      - ".github/workflows/proof-flow-shell-contract.yml"
      - ".github/workflows/rollout-proof-flow-shell.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/szl-flow-proof.css"
      - "scripts/szl-flow-proof.js"
      - "frontend-theme-registry-v1.json"
      - "frontend-flow-shell-state.json"
      - "tools/rollout_proof_flow_shell.py"
      - "tests/test_proof_flow_shell.py"
      - ".github/workflows/proof-flow-shell-contract.yml"
      - ".github/workflows/rollout-proof-flow-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile controllers
        run: python -m py_compile tools/rollout_proof_flow_shell.py tests/test_proof_flow_shell.py
      - name: Run proof-flow contract
        run: python tests/test_proof_flow_shell.py -v
      - name: Verify exact rollout when active
        shell: bash
        run: |
          state="$(python -c 'import json; print(json.load(open("frontend-flow-shell-state.json"))["state"])')"
          if [ "$state" = "ROLLED_OUT" ]; then
            python tools/rollout_proof_flow_shell.py --check
          fi
      - name: Whitespace integrity
        run: git diff --check
