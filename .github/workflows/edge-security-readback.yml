name: Edge Security Readback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-live-readback:
    name: Exact live header readback
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate committed contract and live edge
        run: >-
          python3 scripts/check_security_headers.py
          --url https://a11oy.net/
          --url https://a11oy.net/site.webmanifest
