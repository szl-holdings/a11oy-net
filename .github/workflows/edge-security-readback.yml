name: Edge Security Readback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-live-readback:
    name: Exact live header readback
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate committed contract and live edge
        run: >-
          python3 scripts/check_security_headers.py
          --url https://a11oy.net/
          --url https://a11oy.net/site.webmanifest
