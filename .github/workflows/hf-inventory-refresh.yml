name: hf-inventory-refresh

# Regenerates every Hugging Face count this origin publishes from the
# unauthenticated public Hub API (scripts/generate_hf_inventory.py) and
# proposes the result as a reviewed pull request.
#
# - Holds no Hugging Face token. The generator only issues public GETs, so this
#   workflow cannot write to the Hub and does not depend on any HF secret.
# - Proposes a change only when the generated files differ from main.
#   Unchanged Hub content keeps its original observed_at, so a quiet Hub
#   produces no diff and no pull request.
# - Never merges. A person reviews and squash-merges the proposal.
#
# Pull-request creation: this repository does not let GITHUB_TOKEN open pull
# requests (can_approve_pull_request_reviews=false), and GitHub does not run
# pull_request workflows for a PR that GITHUB_TOKEN opens. If the optional
# secret INVENTORY_PR_TOKEN (a GitHub token, not a Hugging Face token, scoped
# to this repository with contents:write and pull_requests:write) is set, it
# pushes the branch and opens the PR, and the required checks run normally.
# Without it the branch is still pushed and the run summary carries the
# compare URL; a person opening the PR from it also triggers the checks.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Push a refresh branch and open a PR when the output differs (false = dry run: report the diff only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hf-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate HF inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      OPEN_PR: ${{ github.event_name == 'schedule' || inputs.open_pr }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Regenerate from the public Hub API (no token)
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          # No credential is present in this step's environment.
          python3 scripts/generate_hf_inventory.py | tee "${RUNNER_TEMP}/generate.log"
          observed_at="$(python3 -c 'import json;print(json.load(open("estate/hf-current.json"))["observed_at"])')"
          echo "observed_at=${observed_at}" >> "${GITHUB_OUTPUT}"
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=No Hub change::Generated inventory equals main (observed_at ${observed_at}); no PR proposed."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git status --porcelain
          fi

      - name: Validate the regenerated surface
        id: validate
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          set -uo pipefail
          status=pass
          for check in \
            "python3 scripts/check_proof_surface.py" \
            "python3 scripts/check_security_headers.py" \
            "python3 tests/test_generate_hf_inventory.py"; do
            if ! ${check} > "${RUNNER_TEMP}/check.log" 2>&1; then
              status=fail
              echo "::warning title=Validator failed on refresh::${check}"
              tail -n 20 "${RUNNER_TEMP}/check.log"
            fi
          done
          # A failing validator is drift that needs a person (for example a page
          # still links a Space the Hub no longer lists). The proposal is still
          # opened so the failure is reviewed on the PR, never silently dropped.
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Report dry run
        if: steps.generate.outputs.changed == 'true' && env.OPEN_PR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### hf-inventory-refresh dry run"
            echo
            echo "observed_at \`${{ steps.generate.outputs.observed_at }}\` · validators \`${{ steps.validate.outputs.status }}\`"
            echo
            echo '```'
            git diff --stat
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Push refresh branch and propose PR
        if: steps.generate.outputs.changed == 'true' && env.OPEN_PR == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INVENTORY_PR_TOKEN || github.token }}
          TOKEN_KIND: ${{ secrets.INVENTORY_PR_TOKEN != '' && 'automation-token' || 'github-token' }}
          OBSERVED_AT: ${{ steps.generate.outputs.observed_at }}
          VALIDATORS: ${{ steps.validate.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          stamp="$(printf '%s' "${OBSERVED_AT}" | tr -d ':-')"
          branch="bot/hf-inventory-${stamp}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A
          counts="$(python3 -c 'import json;c=json.load(open("estate/hf-current.json"))["counts"];print("models {models} · public datasets {datasets_public} · public Spaces {spaces_public} · kernels {kernels} · collections {collections} · buckets {buckets}".format(**c))')"
          git commit -s -q \
            -m "chore(hf-inventory): regenerate public Hub inventory (${OBSERVED_AT})" \
            -m "Generated by scripts/generate_hf_inventory.py from the unauthenticated Hub API. ${counts}. Private assets NOT_OBSERVED. Run: ${RUN_URL}"
          git push origin "HEAD:refs/heads/${branch}"
          body="$(cat <<EOF
          Regenerated by [hf-inventory-refresh](${RUN_URL}) from the unauthenticated public Hub API. No Hugging Face token is held; nothing on the Hub is written.

          - observed_at: \`${OBSERVED_AT}\`
          - ${counts}
          - private assets: NOT_OBSERVED
          - validators on the runner: **${VALIDATORS}**

          Review the diff, then squash-merge. A failing validator means drift that needs a person, for example a page that still links a Space the Hub no longer lists.
          EOF
          )"
          if pr_url="$(gh pr create --base main --head "${branch}" \
              --title "chore(hf-inventory): regenerate public Hub inventory (${OBSERVED_AT})" \
              --body "${body}" 2> "${RUNNER_TEMP}/pr.err")"; then
            echo "::notice title=Refresh PR opened::${pr_url} (${TOKEN_KIND})"
            echo "Refresh PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
            if [ "${TOKEN_KIND}" = "github-token" ]; then
              # GitHub does not start pull_request workflows for a PR opened by
              # GITHUB_TOKEN, so the required checks stay pending until a person
              # closes and reopens it (or INVENTORY_PR_TOKEN is configured).
              echo "::warning title=Required checks will not start::${pr_url} was opened with GITHUB_TOKEN; close and reopen it to run the required checks."
            fi
          else
            compare="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            cat "${RUNNER_TEMP}/pr.err" >&2 || true
            echo "::warning title=PR creation blocked for ${TOKEN_KIND}::Branch ${branch} is pushed, but this token cannot open pull requests here (org setting can_approve_pull_request_reviews=false). Open it from ${compare} or set INVENTORY_PR_TOKEN. Nothing lands without a reviewed merge."
            {
              echo "### hf-inventory-refresh"
              echo
              echo "Branch \`${branch}\` pushed; PR creation was refused for the ${TOKEN_KIND}."
              echo "Open the PR: ${compare}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
