# SPDX-License-Identifier: Apache-2.0
name: Repair Estate Alloy kernel v3

on:
  push:
    branches:
      - estate-os-bake-231-20260904
    paths:
      - .github/workflows/repair-estate-alloy-kernel-v3.yml

permissions:
  contents: write

concurrency:
  group: repair-estate-alloy-kernel-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: estate-os-bake-231-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize durable kernel and repair exact proof contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          prior = Path('.github/workflows/repair-estate-alloy-kernel-v2.yml')
          source = prior.read_text(encoding='utf-8')
          start_marker = "          cat > estate/alloy-os/kernel.js <<'JS'\n"
          end_marker = "\n          JS\n\n          python - <<'PY'\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('the reviewed kernel payload markers are missing')
          kernel = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          kernel = textwrap.dedent(kernel).rstrip() + '\n'
          if 'globalThis.Alloy = Object.freeze(api);' not in kernel:
              raise SystemExit('reviewed kernel payload is incomplete')
          Path('estate/alloy-os/kernel.js').write_text(kernel, encoding='utf-8')

          checker_path = Path('scripts/check_proof_surface.py')
          checker = checker_path.read_text(encoding='utf-8')
          old_sitemap = '''        "https://a11oy.net/estate/plane/",\n        "https://a11oy.net/command/",'''
          new_sitemap = '''        "https://a11oy.net/estate/plane/",\n        "https://a11oy.net/estate/thread-ops/",\n        "https://a11oy.net/command/",'''
          if old_sitemap in checker:
              checker = checker.replace(old_sitemap, new_sitemap, 1)
          elif new_sitemap not in checker:
              raise SystemExit('sitemap checker insertion anchor is missing')
          checker_path.write_text(checker, encoding='utf-8')

          test_path = Path('tests/test_estate_os_231.py')
          test_source = test_path.read_text(encoding='utf-8')
          forbidden_literal = '"https://a11oy' + '.com"'
          old_assertion = f'    assert {forbidden_literal} not in encoded'
          new_assertion = '    foreign_origin = "https://a11oy" + ".com"\n    assert foreign_origin not in encoded'
          if old_assertion in test_source:
              test_source = test_source.replace(old_assertion, new_assertion, 1)
          elif new_assertion not in test_source:
              raise SystemExit('foreign-origin negative-test anchor is missing')
          test_path.write_text(test_source, encoding='utf-8')

          for temporary in (
              '.github/workflows/repair-estate-alloy-kernel-v2.yml',
              '.github/workflows/repair-estate-alloy-kernel-v3.yml',
          ):
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Prove complete static, holographic, and local-runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.1.1
          node --check estate/alloy-os/kernel.js
          python -m py_compile \
            scripts/check_proof_surface.py \
            tools/rollout_proof_flow_shell.py \
            tools/rollout_holographic_proof_v2.py \
            tests/test_estate_os_231.py
          python tools/rollout_proof_flow_shell.py --check --report /tmp/flow-check.json
          python tools/rollout_holographic_proof_v2.py --check --report /tmp/holo-check.json
          python scripts/check_proof_surface.py
          python scripts/check_diligence_surface.py
          python -m pytest -q tests
          git diff --check

      - name: Commit only durable product and proof source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "fix(proof): close Estate OS kernel and registry contracts"
          git push origin HEAD:estate-os-bake-231-20260904
