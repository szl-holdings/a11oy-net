name: Apply Aegis to Killinchu consolidation record v1

on:
  push:
    branches:
      - feat/aegis-killinchu-consolidation-record-v1
    paths:
      - .github/workflows/apply-aegis-killinchu-consolidation-record-v1.yml

permissions:
  contents: write

concurrency:
  group: apply-aegis-killinchu-consolidation-record-v1
  cancel-in-progress: false

jobs:
  converge:
    name: Preserve proof and move current authority to Killinchu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/aegis-killinchu-consolidation-record-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply fail-closed proof-origin convergence
        run: python tools/apply_aegis_killinchu_consolidation_record_v1.py

      - name: Verify static record and repository contracts
        run: |
          set -euo pipefail
          python -m json.tool decision.json >/dev/null
          python -m json.tool spaces.json >/dev/null
          python -m json.tool consolidation/aegis-killinchu-20260903.json >/dev/null
          python -m unittest tests.test_aegis_killinchu_consolidation -v
          python -m py_compile \
            tools/apply_aegis_killinchu_consolidation_record_v1.py \
            tests/test_aegis_killinchu_consolidation.py
          git diff --check

      - name: Commit only durable proof records
        env:
          BRANCH: feat/aegis-killinchu-consolidation-record-v1
        run: |
          set -euo pipefail
          git rm tools/apply_aegis_killinchu_consolidation_record_v1.py
          git rm .github/workflows/apply-aegis-killinchu-consolidation-record-v1.yml
          git add \
            README.md \
            FRONT_DOOR.md \
            llms.txt \
            index.html \
            aegis/index.html \
            decision/index.html \
            vessels/index.html \
            decision.json \
            spaces.json \
            scripts/szl-holo-proof-v2.js \
            consolidation/aegis-killinchu-20260903.json \
            tests/test_aegis_killinchu_consolidation.py
          git config user.name "SZL Proof Registry Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit -m "feat(proof): preserve Aegis as a Killinchu consolidation record" \
            -m "Keep /aegis/ and frozen assurance cases as static proof while moving all current product authority to Killinchu. Update decision and Space contracts without claiming runtime readiness or formula authority on the proof origin." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
