name: Responsive Proof v3 Contract

on:
  pull_request:
    paths:
      - "assets/szl-responsive-proof-v3.css"
      - "assets/szl-holo-proof-v2.css"
      - "assets/szl-flow-proof-static.css"
      - "responsive-experience-v3.json"
      - "tools/bind_responsive_proof_v3.py"
      - "tests/test_responsive_proof_v3.py"
      - ".github/workflows/responsive-proof-v3-contract.yml"
  push:
    branches: [main]
    paths:
      - "assets/szl-responsive-proof-v3.css"
      - "assets/szl-holo-proof-v2.css"
      - "assets/szl-flow-proof-static.css"
      - "responsive-experience-v3.json"
      - "tools/bind_responsive_proof_v3.py"
      - "tests/test_responsive_proof_v3.py"
      - ".github/workflows/responsive-proof-v3-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Proof mobile-to-theatre responsive contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile binder and tests
        run: >-
          python -m py_compile
          tools/bind_responsive_proof_v3.py
          tests/test_responsive_proof_v3.py

      - name: Run proof responsive contract
        run: python tests/test_responsive_proof_v3.py -v

      - name: Verify exact binding when active
        shell: bash
        run: |
          set -euo pipefail
          state="$(python -c 'import json; print(json.load(open("responsive-experience-v3.json"))["state"])')"
          if [ "$state" = "BOUND" ]; then
            python tools/bind_responsive_proof_v3.py --check
          fi

      - name: Preserve existing proof and diligence contracts
        run: |
          python scripts/check_proof_surface.py
          python scripts/check_diligence_surface.py
          python scripts/check_security_headers.py

      - name: CSS and source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path("assets/szl-responsive-proof-v3.css").read_text(encoding="utf-8")
          if css.count("{") != css.count("}"):
              raise SystemExit("unbalanced CSS braces")
          if len(css.encode("utf-8")) > 30000:
              raise SystemExit("responsive proof CSS exceeds 30 KB")
          PY
          git diff --check
