name: Materialize source-bound Estate OS 231-row monolith

"on":
  push:
    branches:
      - estate-os-bake-231-20260904
    paths:
      - .github/scripts/materialize_estate_os_231.py
      - .github/scripts/patch_estate_os_metadata.py
      - .github/workflows/_materialize_estate_os_231_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-estate-os-231-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Rebuild, validate, receipt, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact Estate OS branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: estate-os-bake-231-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Bind current protected-main reference
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Bind omitted temporary-manifest metadata
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_estate_os_metadata.py

      - name: Materialize the bounded public inventory
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/materialize_estate_os_231.py

      - name: Verify exact counts, bytes, renderer, and no-mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pytest==8.4.2
          python -m py_compile \
            .github/scripts/materialize_estate_os_231.py \
            .github/scripts/patch_estate_os_metadata.py \
            tests/test_estate_os_231.py
          python -m pytest tests/test_estate_os_231.py -q
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('estate/os/data.json').read_text(encoding='utf-8'))
          expected_rings = {
              'holographic': 6,
              'flagship': 8,
              'vertical': 57,
              'kernel': 50,
              'archive': 38,
              'docs': 64,
              'organ': 8,
          }
          assert data['counts']['assets'] == 231
          assert data['counts']['github'] == 117
          assert data['counts']['model'] == 44
          assert data['counts']['dataset'] == 33
          assert data['counts']['space'] == 16
          assert data['counts']['collection'] == 21
          assert data['counts']['rings'] == expected_rings
          assert data['counts']['privateGithubUnavailable'] == 'UNAVAILABLE'
          PY
          git diff --check

      - name: Commit permanent monolith and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            estate/os/data.json \
            estate/os/bake.json \
            estate/os/materialization-receipt.json
          # The metadata binder intentionally modifies the temporary generator
          # before execution. Force removal is confined to these branch-only,
          # self-removing controller files after every product assertion passed.
          git rm -f -- \
            .github/scripts/materialize_estate_os_231.py \
            .github/scripts/patch_estate_os_metadata.py \
            .github/workflows/_materialize_estate_os_231_once.yml
          git commit -s -m 'feat(estate): publish source-bound 231-row Estate OS catalog'
          git push origin HEAD:estate-os-bake-231-20260904
