name: Investor smoke gate (S1–S12)

# Fail-closed investor-honest quality gate for a11oy.net. Does not merge.
# Does not touch Dockerfile / HF byte parity (this repo has neither).
# No POST. No HEAD handlers (KALLPA owns those on a11oy).
#
S7 (AYNI): kernel chips must bind /honest locked_formula_count (8 or N/A /
UNAVAILABLE), not genome LOCKED-PROVEN (25). Both numbers are real. Catalog
25 stays labelled. Do not demand 25 be deleted. Committed chips bind via
scripts/honest_kernel_bind.js (#24).
#
# This workflow is ordinary Actions until branch protection lists the exact
# check-run names. This PR cannot self-certify as control-plane-required.
#
# Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Investor smoke contract (S1-S12 static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest (stdlib gate + pytest runner; no app deps)
        run: python3 -m pip install pytest

      - name: Contract tests (fixtures, labelling, skip-as-green, D-rows)
        run: python3 -m pytest -q tests/test_investor_smoke_gate.py

  bind:
    name: Investor smoke bind (S7 kernel chips bind /honest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: S7 kernel chips must bind /honest (8 or N/A / UNAVAILABLE), not genome 25
        run: python3 -m pytest -q tests/test_investor_smoke_bind.py

  live:
    name: Investor smoke live probes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Live GET/HEAD probes against a11oy.net (no POST)
        run: |
          python3 scripts/investor_smoke_gate.py --mode live \
            --origin https://a11oy.net \
            --origin https://www.a11oy.net
